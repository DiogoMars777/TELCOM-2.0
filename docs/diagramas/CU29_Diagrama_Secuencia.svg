  <!-- LÍNEAS DE VIDA VERTICALES -->
  <line x1="90" y1="130" x2="90" y2="1070" class="life-line" />
  <line x1="320" y1="130" x2="320" y2="1070" class="life-line" />
  <line x1="640" y1="130" x2="640" y2="1070" class="life-line" />
  <line x1="980" y1="130" x2="980" y2="1070" class="life-line" />
  <line x1="1260" y1="130" x2="1260" y2="1070" class="life-line" />
  <line x1="1440" y1="130" x2="1440" y2="1070" class="life-line" />
  <line x1="1580" y1="130" x2="1580" y2="1070" class="life-line" />

  <!-- CABECERAS -->
  <g transform="translate(90, 90)">
    
  <circle cx="0" cy="-26" r="8.5" fill="#ffffea" stroke="#1e293b" stroke-width="1.8" />
  <line x1="0" y1="-17.5" x2="0" y2="5" stroke="#1e293b" stroke-width="2" />
  <line x1="-15" y1="-8" x2="15" y2="-8" stroke="#1e293b" stroke-width="2" />
  <line x1="0" y1="5" x2="-12" y2="25" stroke="#1e293b" stroke-width="2" />
  <line x1="0" y1="5" x2="12" y2="25" stroke="#1e293b" stroke-width="2" />

    <text x="0" y="40" class="life-title">Administrador</text>
  </g>

  <g transform="translate(320, 90)">
    
  <line x1="-25" y1="-20" x2="-25" y2="20" stroke="#475569" stroke-width="2.5" />
  <line x1="-25" y1="0" x2="-20" y2="0" stroke="#475569" stroke-width="2" />
  <circle cx="0" cy="0" r="20" fill="#ffffea" stroke="#475569" stroke-width="2" />

    <text x="0" y="36" class="life-title">UI_ComandoVoz</text>
  </g>

  <g transform="translate(640, 90)">
    
  <circle cx="0" cy="0" r="20" fill="#ffffea" stroke="#475569" stroke-width="2" />
  <path d="M -5 -20 L 4 -24 L 2 -20 C 11 -17 22 -2 20 6" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <polygon points="-7,-20 4,-26 1,-15" fill="#475569" />

    <text x="0" y="36" class="life-title">ComandoVozController</text>
  </g>

  <g transform="translate(980, 90)">
    
  <circle cx="0" cy="0" r="20" fill="#ffffea" stroke="#475569" stroke-width="2" />
  <line x1="-20" y1="24" x2="20" y2="24" stroke="#475569" stroke-width="2.5" />

    <text x="0" y="36" class="life-title">ComandoVoz (NLP)</text>
  </g>

  <g transform="translate(1260, 90)">
    
  <circle cx="0" cy="0" r="20" fill="#ffffea" stroke="#475569" stroke-width="2" />
