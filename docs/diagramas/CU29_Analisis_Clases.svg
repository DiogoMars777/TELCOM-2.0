    <text x="10" y="196" class="method-text">+ find(): ?ComandoVoz</text>
    <text x="10" y="212" class="method-text">+ update(): bool</text>
    <text x="10" y="228" class="method-text">+ interpretar(texto): array</text>
  </g>

