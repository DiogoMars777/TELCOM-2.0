  <text x="100" y="395" class="call-text">2: generarReporte(tipo, filtros)</text>

  <line x1="265" y1="420" x2="475" y2="420" class="msg-call" />
  <polygon points="475,420 469,417 469,423" fill="#1e293b" />
  <text x="270" y="415" class="call-text">2.1: generar(Request $request)</text>

  <line x1="485" y1="440" x2="715" y2="440" class="msg-call" />
  <polygon points="715,440 709,437 709,443" fill="#1e293b" />
  <text x="460" y="435" class="call-text">2.2: generar($tipo, $filtros): array</text>

  <!-- Query Cliente -->
  <line x1="725" y1="460" x2="1145" y2="460" class="msg-call" />
  <polygon points="1145,460 1139,457 1139,463" fill="#1e293b" />
  <text x="680" y="455" class="call-text">2.3.1: table('Cliente')->leftJoin('Zona')->get()</text>

  <line x1="1145" y1="480" x2="725" y2="480" class="msg-ret" />
  <text x="740" y="475" class="ret-text">($clientes)</text>

  <!-- Query Pago -->
  <line x1="725" y1="500" x2="1355" y2="500" class="msg-call" />
  <polygon points="1355,500 1349,497 1349,503" fill="#1e293b" />
  <text x="680" y="495" class="call-text">2.3.2: table('Pago')->join('MetodoPago')->get()</text>

  <line x1="1355" y1="520" x2="725" y2="520" class="msg-ret" />
  <text x="740" y="515" class="ret-text">($pagos)</text>

  <!-- Query Mensualidad -->
  <line x1="725" y1="540" x2="1545" y2="540" class="msg-call" />
  <polygon points="1545,540 1539,537 1539,543" fill="#1e293b" />
  <text x="680" y="535" class="call-text">2.3.3: table('Mensualidad')->whereIn('estado', ['PENDIENTE','VENCIDA'])->get()</text>

  <line x1="1545" y1="560" x2="725" y2="560" class="msg-ret" />
  <text x="740" y="555" class="ret-text">($mensualidades)</text>

  <line x1="715" y1="580" x2="485" y2="580" class="msg-ret" />
  <text x="490" y="575" class="ret-text">($reporteConsolidado)</text>

  <line x1="475" y1="610" x2="265" y2="610" class="msg-ret" />
  <text x="270" y="605" class="ret-text">success({reporte: $reporteConsolidado})</text>

  <line x1="255" y1="625" x2="85" y2="625" class="msg-ret" />
  <text x="100" y="620" class="ret-text">mostrarTablaReporteConKPIs()</text>

